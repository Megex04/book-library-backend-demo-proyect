# Configuración de la aplicación para entorno de desarrollo
spring.application.name=biblio.system
server.port=8080

# Configuración de la base de datos (MySQL para desarrollo)
spring.datasource.url=jdbc:mysql://localhost:3308/bibliodb_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1204311012mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración adicional para MySQL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Configuración de Hibernate para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización de la base de datos
spring.sql.init.mode=never
