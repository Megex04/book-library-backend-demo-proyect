# Configuración de la aplicación para entorno de producción
spring.application.name=biblio.system
server.port=8080

# Configuración de la base de datos (MySQL para producción)
spring.datasource.url=jdbc:mysql://localhost:3306/bibliodb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración adicional para MySQL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Configuración de Hibernate para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Inicialización de la base de datos
spring.sql.init.mode=never
# Descomenta las siguientes líneas si deseas inicializar la base de datos con los scripts SQL
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:db/mysql/schema.sql
# spring.sql.init.data-locations=classpath:db/mysql/data.sql

# Configuración JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuración JWT
jwt.secret=${JWT_SECRET:ClaveSecretaParaFirmarTokensJWTDebeSerLargaYSegura123456789}
jwt.expiration=86400000
jwt.refresh-token.expiration=604800000

# Configuración de correo electrónico
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tu-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tu-contraseña-de-aplicacion}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración de tamaño máximo de archivos para carga masiva
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración de zona horaria
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Configuración de logging
logging.level.org.springframework.security=WARN
logging.level.com.lacunza.biblio=INFO

# Configuración CORS
biblio.app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}