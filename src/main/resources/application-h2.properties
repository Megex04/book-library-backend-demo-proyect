# Configuración de la aplicación para entorno con H2 (memoria)
spring.application.name=biblio.system
server.port=8080

# Configuración de la base de datos (H2 en memoria)
spring.datasource.url=jdbc:h2:mem:bibliodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración JWT
jwt.secret=ClaveSecretaParaFirmarTokensJWTDebeSerLargaYSegura123456789
jwt.expiration=86400000
jwt.refresh-token.expiration=604800000

# Configuración de correo electrónico
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=miantolalfa04@gmail.com
spring.mail.password=nkdf hoiw vhbd woax
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración de tamaño máximo de archivos para carga masiva
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración de zona horaria
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Configuración de logging
logging.level.org.springframework.security=INFO
logging.level.com.lacunza.biblio=DEBUG

# Configuración CORS
biblio.app.cors.allowed-origins=http://localhost:4200